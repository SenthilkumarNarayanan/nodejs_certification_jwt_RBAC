<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-4">

<h2>Shopping Cart Dashboard</h2>

<div class="mb-3">

<button onclick="loadProducts()" class="btn btn-primary">Shopping List</button>

<button id="addProductBtn" onclick="location='addProduct.html'" class="btn btn-success">Add Product</button>

<button id="usersBtn" onclick="location='users.html'" class="btn btn-warning">User List</button>

<button onclick="logout()" class="btn btn-danger">Logout</button>

</div>

<table class="table table-bordered">

<thead>
<tr>
<th>Name</th>
<th>Price</th>
<th>Description</th>
</tr>
</thead>

<tbody id="products"></tbody>

</table>

<script>

const token = localStorage.getItem("token")
const role = localStorage.getItem("role")

if(role !== "admin"){
document.getElementById("addProductBtn").style.display="none"
document.getElementById("usersBtn").style.display="none"
}

async function loadProducts(){

const res = await fetch("/api/products",{
headers:{Authorization:"Bearer "+token}
})

const data = await res.json()

const table = document.getElementById("products")

table.innerHTML=""

data.forEach(p=>{

table.innerHTML += `
<tr>
<td>${p.name}</td>
<td>${p.price}</td>
<td>${p.description}</td>
</tr>
`

})

}

loadProducts()

function logout(){
localStorage.clear()
window.location="login.html"
}

</script>

</body>
</html>
